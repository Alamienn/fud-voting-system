<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FUD Voting System - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --fud-primary: #0a3d7c;
            --fud-secondary: #f5c518;
            --fud-gradient: linear-gradient(135deg, #0a3d7c 0%, #1a5a9c 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: var(--fud-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: #fff;
            border-radius: 24px;
            padding: 40px 35px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-card .auth-logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-card .auth-logo h3 {
            font-weight: 700;
            color: var(--fud-primary);
            font-size: 1.8rem;
        }

        .auth-card .auth-logo h3 span {
            color: var(--fud-secondary);
        }

        .auth-card .auth-logo p {
            color: #5a6e85;
            font-size: 0.9rem;
        }

        .auth-card .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            transition: all 0.25s ease;
        }

        .auth-card .form-control:focus {
            border-color: var(--fud-primary);
            box-shadow: 0 0 0 3px rgba(10, 61, 124, 0.12);
        }

        .btn-primary-fud {
            background: var(--fud-gradient);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            color: #fff;
            transition: all 0.3s ease;
        }

        .btn-primary-fud:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(10, 61, 124, 0.3);
            color: #fff;
        }

        .auth-link {
            color: var(--fud-primary);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-link:hover {
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #a0b0c4;
            font-size: 0.85rem;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .alert-fud {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: #5a3e00;
            display: none;
        }

        .toast-fud {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2a3a;
            color: #fff;
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: 500;
            z-index: 9999;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            border-left: 5px solid var(--fud-secondary);
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-logo">
            <h3>FUD <span>Voting</span></h3>
            <p>Create your voting account</p>
        </div>

        <div id="alertMessage" class="alert-fud"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="mb-2">
                <label class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" id="regFullName" placeholder="e.g. Muhammad Mustapha Usman" required />
            </div>
            <div class="mb-2">
                <label class="form-label fw-semibold">Registration Number</label>
                <input type="text" class="form-control" id="regRegNo" placeholder="e.g. FUD/CS/2022/001" required />
            </div>
            <div class="mb-2">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" class="form-control" id="regEmail" placeholder="e.g. student@fud.edu.ng" required />
            </div>
            <div class="mb-2">
                <label class="form-label fw-semibold">Department</label>
                <select class="form-control" id="regDepartment" required>
                    <option value="">Select Department</option>
                    <option>Computer Science</option>
                    <option>Economics</option>
                    <option>Political Science</option>
                    <option>Law</option>
                    <option>Engineering</option>
                    <option>Mass Communication</option>
                    <option>Mathematics</option>
                    <option>Biology</option>
                </select>
            </div>
            <div class="mb-2">
                <label class="form-label fw-semibold">Level</label>
                <select class="form-control" id="regLevel" required>
                    <option value="">Select Level</option>
                    <option>100L</option>
                    <option>200L</option>
                    <option>300L</option>
                    <option>400L</option>
                    <option>500L</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control" id="regPassword" placeholder="Min 6 characters" required minlength="6" />
            </div>
            <button type="submit" class="btn btn-primary-fud">
                <i class="bi bi-person-plus me-2"></i> Create Account
            </button>
        </form>

        <div class="divider">or</div>

        <p class="text-center mb-0">
            Already have an account?
            <a href="login.html" class="auth-link">Sign In</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>
        function handleRegister(e) {
            e.preventDefault();

            const fullName = document.getElementById('regFullName').value.trim();
            const regNo = document.getElementById('regRegNo').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const department = document.getElementById('regDepartment').value;
            const level = document.getElementById('regLevel').value;
            const password = document.getElementById('regPassword').value;

            if (!fullName || !regNo || !email || !department || !level || password.length < 6) {
                showAlert('⚠️ Please fill all fields correctly (password min 6 chars)');
                return;
            }

            // API call to backend
            fetch('backend/api/register.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, regNo, email, department, level, password })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        showToast('✅ Registration successful! Please login.');
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 1200);
                    } else {
                        showAlert(data.message || 'Registration failed!');
                    }
                })
                .catch(err => {
                    // Fallback to local storage for demo
                    const users = JSON.parse(localStorage.getItem('fud_voters') || '[]');
                    if (users.find(u => u.regNo === regNo)) {
                        showAlert('⚠️ Registration number already exists!');
                        return;
                    }
                    if (users.find(u => u.email === email)) {
                        showAlert('⚠️ Email already registered!');
                        return;
                    }
                    users.push({ fullName, regNo, email, department, level, password });
                    localStorage.setItem('fud_voters', JSON.stringify(users));
                    showToast('✅ Registration successful! Please login.');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1200);
                });
        }

        function showAlert(msg) {
            const el = document.getElementById('alertMessage');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        function showToast(message) {
            const existing = document.querySelector('.toast-fud');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-fud';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3500);
        }
    </script>

</body>
</html>
